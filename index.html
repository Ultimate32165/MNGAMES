<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>How Well Do You Know Me?</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Plus Jakarta Sans Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Firebase Compat Libraries -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #1e122b; /* Deep twilight plum */
      color: #f7efff;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .tap-none {
      -webkit-tap-highlight-color: transparent;
    }
    /* Subtle focus outline for minimalist feel */
    input:focus, textarea:focus {
      outline: none;
      box-shadow: 0 0 0 2px #f9738f;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center p-4 sm:p-6 tap-none selection:bg-rose-500/30 selection:text-white">

  <!-- Centered App Viewport -->
  <div class="w-full max-w-sm my-auto space-y-6">

    <header class="text-center space-y-1.5">
      <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-semibold tracking-wider uppercase text-rose-300 bg-rose-950/50 border border-rose-800/40">
        <span class="w-1.5 h-1.5 rounded-full bg-rose-400 animate-pulse"></span>
        Couples Quiz
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white">How well do you know me?</h1>
      <p class="text-xs text-purple-200/65 font-normal">Answer in secret, reveal together.</p>
    </header>

    <!-- Screen 1: Lobby Screen -->
    <main id="lobby-screen" class="bg-[#291b3b] border border-purple-900/50 rounded-2xl p-5 sm:p-6 shadow-xl space-y-4">
      <div class="space-y-1.5">
        <label for="player-name-input" class="block text-[11px] font-semibold uppercase tracking-wider text-purple-300/70">Your Name</label>
        <input 
          id="player-name-input" 
          type="text" 
          placeholder="e.g. Angie" 
          maxlength="20"
          class="w-full px-4 py-3 bg-[#1e122b] border border-purple-900/60 rounded-xl text-sm font-medium text-white placeholder:text-purple-300/35 transition" 
        />
      </div>

      <div class="space-y-2 pt-1">
        <button 
          type="button"
          onclick="createRoom()" 
          class="w-full py-3 bg-rose-500 hover:bg-rose-400 text-white rounded-xl text-xs font-bold tracking-wider uppercase transition active:scale-[0.99] shadow-md shadow-rose-950/40"
        >
          Create New Room
        </button>

        <button 
          id="toggle-join-btn"
          type="button"
          onclick="toggleJoinSection(true)" 
          class="w-full py-3 bg-[#382552] hover:bg-[#432d61] text-purple-100 rounded-xl text-xs font-semibold tracking-wider transition active:scale-[0.99]"
        >
          Join with Code
        </button>
      </div>

      <!-- Join Form Section -->
      <div id="join-box" class="hidden pt-3 border-t border-purple-900/40 space-y-3">
        <div class="space-y-1.5">
          <label for="join-code-input" class="block text-[11px] font-semibold uppercase tracking-wider text-purple-300/70">6-Digit Code</label>
          <div class="flex gap-2">
            <input 
              id="join-code-input" 
              type="text" 
              placeholder="123456" 
              maxlength="6"
              class="flex-1 px-3 py-2.5 bg-[#1e122b] border border-purple-900/60 rounded-xl text-sm font-semibold tracking-widest text-center uppercase text-white placeholder:text-purple-300/35 transition" 
            />
            <button 
              type="button"
              onclick="joinRoom()" 
              class="px-5 py-2.5 bg-rose-500 hover:bg-rose-400 text-white font-bold rounded-xl text-xs uppercase tracking-wider active:scale-[0.99] transition"
            >
              Join
            </button>
          </div>
        </div>
        <p id="invite-note" class="text-[11px] text-rose-300 hidden text-center font-medium bg-rose-950/40 py-1.5 rounded-lg border border-rose-900/50">
          Room link applied! Enter your name and click Join.
        </p>
      </div>
    </main>

    <!-- Screen 2: Game Screen -->
    <main id="game-screen" class="hidden space-y-3.5">
      
      <!-- Top Minimal Status Bar -->
      <div class="flex items-center justify-between px-1 text-xs">
        <div class="flex items-center gap-2">
          <span class="text-purple-300/60 font-medium">Room</span>
          <span id="active-room-code" class="font-mono font-bold text-rose-400 bg-[#291b3b] px-2 py-0.5 rounded-lg border border-purple-900/50">------</span>
          <button 
            type="button"
            onclick="copyInviteLink()" 
            class="text-purple-200 hover:text-white bg-[#382552] border border-purple-800/60 px-2 py-0.5 rounded-lg text-[11px] font-medium transition active:scale-95"
          >
            Copy link
          </button>
        </div>
        <button 
          type="button"
          onclick="leaveRoom()" 
          class="text-purple-300/60 hover:text-rose-400 text-[11px] font-medium transition"
        >
          Exit
        </button>
      </div>

      <!-- Vibrant Minimal Question Card -->
      <div class="bg-[#291b3b] border border-purple-900/50 rounded-2xl p-5 text-center space-y-1.5 shadow-lg">
        <span class="text-[10px] font-bold uppercase tracking-widest text-rose-400">Current Question</span>
        <h2 id="current-question-text" class="text-base font-semibold text-white leading-snug">Loading...</h2>
      </div>

      <!-- Secret Input Section -->
      <div id="answer-form-box" class="space-y-2.5">
        <textarea 
          id="my-answer-input" 
          rows="2" 
          placeholder="Type your secret answer here..." 
          class="w-full p-3.5 bg-[#291b3b] border border-purple-900/50 rounded-xl text-sm font-normal text-white placeholder:text-purple-300/40 resize-none transition"
        ></textarea>
        <button 
          id="lock-in-btn" 
          type="button"
          onclick="submitMyAnswer()" 
          class="w-full py-3 bg-rose-500 hover:bg-rose-400 text-white font-bold rounded-xl text-xs uppercase tracking-wider transition active:scale-[0.99] shadow-md shadow-rose-950/40 flex items-center justify-center gap-1.5"
        >
          Lock In Answer
        </button>
      </div>

      <!-- Live Player Presence Status -->
      <div class="grid grid-cols-2 gap-2 text-xs">
        <div class="bg-[#291b3b] border border-purple-900/40 rounded-xl p-3 text-center space-y-1">
          <div id="p1-name-display" class="font-semibold text-purple-100 truncate">Player 1</div>
          <div id="p1-status-pill" class="text-[10px] text-purple-300/60 font-medium">Thinking...</div>
        </div>
        <div class="bg-[#291b3b] border border-purple-900/40 rounded-xl p-3 text-center space-y-1">
          <div id="p2-name-display" class="font-semibold text-purple-100 truncate">Waiting...</div>
          <div id="p2-status-pill" class="text-[10px] text-purple-300/60 font-medium">Not joined</div>
        </div>
      </div>

      <!-- Answers Reveal Area -->
      <div id="reveal-container" class="hidden space-y-3 pt-1">
        <div class="grid grid-cols-1 gap-2.5">
          <div class="p-3.5 bg-[#201430] border border-rose-500/30 rounded-xl space-y-1">
            <span id="revealed-p1-label" class="block text-[10px] font-bold uppercase tracking-wider text-rose-300">Player 1</span>
            <p id="revealed-p1-text" class="text-sm font-medium text-white whitespace-pre-wrap leading-relaxed">--</p>
          </div>
          <div class="p-3.5 bg-[#201430] border border-purple-500/30 rounded-xl space-y-1">
            <span id="revealed-p2-label" class="block text-[10px] font-bold uppercase tracking-wider text-purple-300">Player 2</span>
            <p id="revealed-p2-text" class="text-sm font-medium text-white whitespace-pre-wrap leading-relaxed">--</p>
          </div>
        </div>

        <button 
          type="button"
          onclick="nextQuestion()" 
          class="w-full py-3 bg-[#382552] hover:bg-[#432d61] text-purple-100 font-bold rounded-xl text-xs uppercase tracking-wider transition active:scale-[0.99] border border-purple-800/50"
        >
          Next Question →
        </button>
      </div>

    </main>

    <!-- Subtle Floating Toast Message -->
    <div 
      id="toast" 
      class="fixed bottom-6 left-1/2 -translate-x-1/2 hidden bg-[#291b3b] text-white border border-purple-800/60 px-4 py-2.5 rounded-xl text-xs font-medium shadow-2xl z-50 transition"
    >
      Notification
    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAaVc7IRNLksoKv6PDXE2Vs7D_K3QzHgCc",
      authDomain: "couplequizzes-57680.firebaseapp.com",
      databaseURL: "https://couplequizzes-57680-default-rtdb.firebaseio.com",
      projectId: "couplequizzes-57680",
      storageBucket: "couplequizzes-57680.firebasestorage.app",
      messagingSenderId: "881639719010",
      appId: "1:881639719010:web:3b63772e8221096a4ed13b"
    };

    const COUPLE_QUESTIONS = [
      "What is my absolute favorite comfort food?",
      "Where is my dream vacation destination with you?",
      "What was my very first impression of you?",
      "What song reminds you the most of us?",
      "What is something silly that instantly makes me laugh?",
      "Who takes longer to get ready before leaving the house?",
      "What is my go-to coffee or drink order?",
      "What is one habit of mine that you secretly find adorable?",
      "If we could adopt any pet tomorrow, what would it be?",
      "What is your single favorite memory of us together?",
      "What was the first movie or show we watched together?",
      "What is my biggest pet peeve?",
      "Who said 'I love you' first, and where were we?",
      "What is something you think I cannot live without?",
      "If you could describe our relationship in three words, what are they?"
    ];

    let db = null;
    let roomRef = null;
    let currentRoomCode = null;
    let myRole = null;
    let myName = "Player";
    let roomListener = null;

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.innerText = msg;
      toast.classList.remove("hidden");
      setTimeout(() => {
        toast.classList.add("hidden");
      }, 2800);
    }

    function setupFirebase() {
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        db = firebase.database();
      } catch (err) {
        console.warn("Firebase initialization warning:", err);
      }
    }

    function checkUrlForRoomCode() {
      const params = new URLSearchParams(window.location.search);
      const roomParam = params.get("room");
      if (roomParam) {
        const cleanCode = roomParam.trim().toUpperCase();
        document.getElementById("join-code-input").value = cleanCode;
        toggleJoinSection(true);
        document.getElementById("invite-note").classList.remove("hidden");
      }
    }

    function toggleJoinSection(show) {
      const box = document.getElementById("join-box");
      const toggleBtn = document.getElementById("toggle-join-btn");
      if (show) {
        box.classList.remove("hidden");
        toggleBtn.classList.add("hidden");
        document.getElementById("join-code-input").focus();
      } else {
        box.classList.add("hidden");
        toggleBtn.classList.remove("hidden");
      }
    }

    function createRoom() {
      const nameVal = document.getElementById("player-name-input").value.trim();
      myName = nameVal || "Player 1";

      if (!db) {
        showToast("Unable to reach database.");
        return;
      }

      const roomCode = Math.floor(100000 + Math.random() * 900000).toString();
      currentRoomCode = roomCode;
      myRole = "player1";

      const initialRoom = {
        questionIndex: 0,
        questionText: COUPLE_QUESTIONS[0],
        revealed: false,
        player1: { name: myName, answer: "", submitted: false },
        player2: { name: "", answer: "", submitted: false }
      };

      roomRef = db.ref("couples_quiz_rooms/" + roomCode);
      roomRef.set(initialRoom)
        .then(() => {
          attachRoomListener();
          switchToGameUI();
          showToast("Room created! Copy link to invite.");
        })
        .catch((err) => {
          console.error(err);
          showToast("Error creating room. Check database rules.");
        });
    }

    function joinRoom() {
      const nameVal = document.getElementById("player-name-input").value.trim();
      const codeVal = document.getElementById("join-code-input").value.trim().toUpperCase();

      if (!codeVal || codeVal.length < 5) {
        showToast("Enter a 6-digit room code.");
        return;
      }

      myName = nameVal || "Player 2";
      currentRoomCode = codeVal;
      myRole = "player2";

      if (!db) {
        showToast("Unable to reach database.");
        return;
      }

      roomRef = db.ref("couples_quiz_rooms/" + codeVal);
      roomRef.once("value")
        .then((snapshot) => {
          const val = snapshot.val();
          if (!val) {
            showToast("Room not found.");
            return;
          }

          roomRef.child("player2").update({
            name: myName
          });

          attachRoomListener();
          switchToGameUI();
          showToast("Joined room.");
        })
        .catch((err) => {
          console.error(err);
          showToast("Could not join room.");
        });
    }

    function copyInviteLink() {
      if (!currentRoomCode) return;
      const url = `${window.location.origin}${window.location.pathname}?room=${currentRoomCode}`;
      
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(url)
          .then(() => showToast("Link copied to clipboard!"))
          .catch(() => fallbackCopy(url));
      } else {
        fallbackCopy(url);
      }
    }

    function fallbackCopy(text) {
      const tempInput = document.createElement("input");
      tempInput.value = text;
      document.body.appendChild(tempInput);
      tempInput.select();
      try {
        document.execCommand('copy');
        showToast("Link copied!");
      } catch (e) {
        showToast("Room code: " + currentRoomCode);
      }
      document.body.removeChild(tempInput);
    }

    function attachRoomListener() {
      if (!roomRef) return;
      if (roomListener) roomRef.off("value", roomListener);

      roomListener = roomRef.on("value", (snapshot) => {
        const data = snapshot.val();
        if (!data) return;
        renderGameState(data);
      });
    }

    function renderGameState(data) {
      const p1 = data.player1 || { name: "Player 1", submitted: false, answer: "" };
      const p2 = data.player2 || { name: "", submitted: false, answer: "" };

      document.getElementById("current-question-text").innerText = data.questionText || COUPLE_QUESTIONS[0];
      document.getElementById("p1-name-display").innerText = p1.name || "Player 1";
      document.getElementById("p2-name-display").innerText = p2.name ? p2.name : "Waiting...";

      updatePill("p1-status-pill", p1.name, p1.submitted);
      updatePill("p2-status-pill", p2.name, p2.submitted);

      const me = myRole === "player1" ? p1 : p2;
      const lockInBtn = document.getElementById("lock-in-btn");
      const answerInput = document.getElementById("my-answer-input");

      if (me && me.submitted) {
        lockInBtn.disabled = true;
        lockInBtn.classList.add("opacity-40", "cursor-not-allowed");
        lockInBtn.innerText = "Locked in. Waiting for partner...";
        answerInput.disabled = true;
      } else {
        lockInBtn.disabled = false;
        lockInBtn.classList.remove("opacity-40", "cursor-not-allowed");
        lockInBtn.innerText = "Lock In Answer";
        answerInput.disabled = false;
      }

      const revealContainer = document.getElementById("reveal-container");
      const bothSubmitted = p1.submitted && p2.submitted;

      if (bothSubmitted) {
        revealContainer.classList.remove("hidden");
        document.getElementById("revealed-p1-label").innerText = p1.name || "Player 1";
        document.getElementById("revealed-p2-label").innerText = p2.name || "Player 2";
        document.getElementById("revealed-p1-text").innerText = p1.answer || "(No answer)";
        document.getElementById("revealed-p2-text").innerText = p2.answer || "(No answer)";

        if (!data.revealed) {
          triggerConfetti();
          if (myRole === "player1") {
            roomRef.update({ revealed: true });
          }
        }
      } else {
        revealContainer.classList.add("hidden");
      }
    }

    function updatePill(pillId, playerName, isSubmitted) {
      const el = document.getElementById(pillId);
      if (!playerName) {
        el.className = "text-[10px] text-purple-300/40 font-medium";
        el.innerText = "Not joined";
        return;
      }

      if (isSubmitted) {
        el.className = "text-[10px] font-bold text-rose-400";
        el.innerText = "Locked in ✓";
      } else {
        el.className = "text-[10px] text-purple-300/60 font-medium";
        el.innerText = "Thinking...";
      }
    }

    function submitMyAnswer() {
      const input = document.getElementById("my-answer-input");
      const answer = input.value.trim();

      if (!answer) {
        showToast("Write your answer first!");
        return;
      }

      if (roomRef && myRole) {
        roomRef.child(myRole).update({
          answer: answer,
          submitted: true
        });
      }
    }

    function nextQuestion() {
      if (!roomRef) return;

      roomRef.once("value").then((snap) => {
        const data = snap.val() || {};
        let nextIdx = (data.questionIndex || 0) + 1;
        if (nextIdx >= COUPLE_QUESTIONS.length) nextIdx = 0;

        const p1Name = data.player1?.name || "Player 1";
        const p2Name = data.player2?.name || "Player 2";

        roomRef.update({
          questionIndex: nextIdx,
          questionText: COUPLE_QUESTIONS[nextIdx],
          revealed: false,
          player1: { name: p1Name, answer: "", submitted: false },
          player2: { name: p2Name, answer: "", submitted: false }
        });

        document.getElementById("my-answer-input").value = "";
      });
    }

    function switchToGameUI() {
      document.getElementById("lobby-screen").classList.add("hidden");
      document.getElementById("game-screen").classList.remove("hidden");
      document.getElementById("active-room-code").innerText = currentRoomCode;
    }

    function leaveRoom() {
      if (roomRef && roomListener) {
        roomRef.off("value", roomListener);
      }
      window.location.href = window.location.pathname;
    }

    function triggerConfetti() {
      if (typeof confetti === "function") {
        confetti({
          particleCount: 50,
          spread: 60,
          origin: { y: 0.65 },
          colors: ['#f43f5e', '#fb7185', '#d946ef', '#c084fc']
        });
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      setupFirebase();
      checkUrlForRoomCode();
    });
  </script>
</body>
</html>
